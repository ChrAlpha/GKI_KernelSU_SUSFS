name: Prepare and Build

on:
  workflow_call:
    inputs:
      config_file:
        description: "Path to the JSON config file"
        required: true
        type: string
      feature_set:
        description: "Feature Set"
        required: false
        type: string
      variant:
        description: "Build Variant (All, Normal, Bypass, Wild)"
        required: false
        type: string
      use_repo:
        description: "Use repo for downloading kernel source"
        required: false
        type: boolean
        default: false
      single_sublevel:
        description: "Only build this sublevel"
        required: false
        type: string
      single_os_patch_level:
        description: "Only build this OS patch level"
        required: false
        type: string
      manifest_url:
        description: "Optional manifest URL override"
        required: false
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.final.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Read Config and Build Final Matrix
        id: final
        shell: bash
        run: |
          if [ ! -f "${{ inputs.config_file }}" ]; then
            echo "Error: Config file not found: ${{ inputs.config_file }}"
            exit 1
          fi

          if { [ -n "${{ inputs.single_sublevel }}" ] && [ -z "${{ inputs.single_os_patch_level }}" ]; } || \
             { [ -z "${{ inputs.single_sublevel }}" ] && [ -n "${{ inputs.single_os_patch_level }}" ]; }; then
            echo "Error: single_sublevel and single_os_patch_level must be provided together"
            exit 1
          fi

          CONFIG_JSON=$(cat "${{ inputs.config_file }}" | jq -c .)
          MANIFEST_URL="${{ inputs.manifest_url }}"

          if [ -n "${{ inputs.single_sublevel }}" ] && [ -n "${{ inputs.single_os_patch_level }}" ]; then
            FILTERED=$(echo "$CONFIG_JSON" | jq -c \
              --arg sub "${{ inputs.single_sublevel }}" \
              --arg date "${{ inputs.single_os_patch_level }}" \
              '.include = [ .include[] | select(.sublevel == $sub and .date == $date) ]')

            MATCH_COUNT=$(echo "$FILTERED" | jq '.include | length')
            if [ "$MATCH_COUNT" -eq 0 ]; then
              echo "Error: No matching entry in config for sublevel=${{ inputs.single_sublevel }}, date=${{ inputs.single_os_patch_level }}"
              exit 1
            fi

            CONFIG_JSON="$FILTERED"
            echo "Single-build mode enabled: sublevel=${{ inputs.single_sublevel }}, date=${{ inputs.single_os_patch_level }}"
          fi

          # Build the variant list as a JSON array
          if [ "${{ inputs.variant }}" = "All" ] || [ -z "${{ inputs.variant }}" ]; then
            VARIANTS='["Normal","Bypass","Wild"]'
          else
            VARIANTS=$(jq -cn --arg v "${{ inputs.variant }}" '[$v]')
          fi

          # Build { "include": [ {android_version:..., kernel_version:..., sublevel:..., os_patch_level:..., variant: ...}, ... ] }
          FINAL=$(jq -cn \
            --argjson cfg "$CONFIG_JSON" \
            --arg manifest_url "$MANIFEST_URL" \
            --argjson variants "$VARIANTS" '
            ($cfg.version | split("-")) as $version_parts
            | {
              include: (
                [
                  $cfg.include[] as $item
                  | $variants[] as $build_variant
                  | {
                      version: $cfg.version,
                      android_version: $version_parts[0],
                      kernel_version: $version_parts[1],
                      sublevel: $item.sublevel,
                      os_patch_level: $item.date,
                      variant: $build_variant,
                      manifest_url: $manifest_url
                    }
                ]
                + [
                  $cfg.include[] as $item
                  | select($item.variant != null)
                  | {
                      version: $cfg.version,
                      android_version: $version_parts[0],
                      kernel_version: $version_parts[1],
                      sublevel: $item.sublevel,
                      os_patch_level: $item.date,
                      variant: $item.variant,
                      manifest_url: $manifest_url
                    }
                ]
                | unique_by([.android_version, .kernel_version, .sublevel, .os_patch_level, .variant])
              )
            }')

          echo "matrix=$FINAL" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ matrix.version }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sublevel: ${{ matrix.sublevel }}
      os_patch_level: ${{ matrix.os_patch_level }}
      variant: ${{ matrix.variant }}
      feature_set: ${{ inputs.feature_set }}
      use_repo: ${{ inputs.use_repo }}
      manifest_url: ${{ matrix.manifest_url }}
    secrets: inherit